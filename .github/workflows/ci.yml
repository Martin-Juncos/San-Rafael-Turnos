name: Backend CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: san_rafael_turnos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d san_rafael_turnos_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/san_rafael_turnos_test
      DB_SCHEMA: ""
      DB_BASELINE_ASSUME_APPLIED: "false"
      JWT_ACCESS_SECRET: ci_access_secret_1234567890
      JWT_REFRESH_SECRET: ci_refresh_secret_1234567890
      FRONTEND_PUBLIC_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      WHATSAPP_PROVIDER: mock

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL readiness
        run: |
          until pg_isready -h localhost -p 5432 -U postgres -d san_rafael_turnos_test; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and smoke tests
        run: |
          echo "PWD=$(pwd)"
          find tests -maxdepth 1 -type f -name '*.test.js' -print
          node scripts/run-node-tests.mjs unit

      - name: Build
        run: npm run build

      - name: Apply migrations on test DB
        run: npm run db:migrate

      - name: Validate DB schema
        run: npm run db:validate

      - name: Integration tests
        id: integration_tests
        run: npm run test:integration

      - name: Diagnostic migration status on integration failure
        if: ${{ failure() && steps.integration_tests.outcome == 'failure' }}
        run: npm run db:status || true
