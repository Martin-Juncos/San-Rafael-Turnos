services:
  - type: web
    runtime: node
    name: san-rafael-turnos-backend
    rootDir: backend
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: npm ci
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: san-rafael-turnos-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "7"
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "200"
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_WEBHOOK_URL
        sync: false
      - key: OTP_TTL_SECONDS
        value: "300"
      - key: APPOINTMENT_HOLD_MINUTES
        value: "10"
      - key: HOLD_EXPIRATION_JOB_INTERVAL_MINUTES
        value: "1"
      - key: PAYMENT_DEFAULT_CURRENCY
        value: ARS
      - key: PATIENT_MESSAGE_WINDOW_HOURS
        value: "72"

  - type: web
    runtime: static
    name: san-rafael-turnos-frontend
    rootDir: frontend
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_API_WITH_CREDENTIALS
        value: "false"
      - key: VITE_API_TIMEOUT_MS
        value: "12000"
      - key: VITE_API_RETRY_COUNT
        value: "1"
      - key: VITE_MERCADOPAGO_PUBLIC_KEY
        sync: false

databases:
  - name: san-rafael-turnos-db
    databaseName: san_rafael_turnos
    user: san_rafael_turnos
    plan: basic-256mb
    postgresMajorVersion: "16"
